<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Hunter — Settings</title>
  <style>
    body { font: 14px/1.5 -apple-system, system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #1d2226; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    p.hint { color: #5e6870; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 16px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #b6bcc2; border-radius: 6px; font: inherit; }
    .row { display: flex; gap: 8px; margin-top: 20px; }
    button { padding: 8px 16px; border-radius: 16px; border: 1px solid #0a66c2; background: #0a66c2; color: #fff; font: 600 14px system-ui; cursor: pointer; }
    button.secondary { background: #fff; color: #0a66c2; }
    #status { margin-top: 16px; min-height: 1.5em; }
    .ok { color: #057642; } .err { color: #b24020; }
  </style>
</head>
<body>
  <h1>📩 Job Hunter — Settings</h1>
  <p class="hint">From your Google Sheet's Apps Script: the Web app URL (Deploy → Manage deployments) and the SYNC_TOKEN shown by ⚡ Auto Apply → ⚙️ Setup.</p>

  <label for="url">Web app URL</label>
  <input id="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">

  <label for="token">Sync token</label>
  <input id="token" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off">

  <div class="row">
    <button id="save">Save</button>
    <button id="test" class="secondary">Test connection</button>
  </div>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
